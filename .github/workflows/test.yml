name: f1ndr Backend Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi==0.115.0 uvicorn[standard]==0.30.1 pydantic>=2.10.0 pydantic-settings>=2.4.0 "pymongo>=4.9,<5.0" "motor>=3.7.1,<4.0" pytest httpx locust pytest-asyncio

      - name: Run tests
        run: |
          pytest
        env:
          PYTHONPATH: .
