name: F1NDR Backend Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r f1ndr_backend/requirements.txt
          pip install pytest httpx locust

      - name: Run tests
        run: |
          pytest f1ndr_backend/tests
