name: f1ndr Backend Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Enterprise Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install pytest httpx locust pytest-asyncio
          pip install -e .

      - name: Run Package Test Suite
        run: |
          pytest
